<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wishlist — Safa World</title>
    <meta name="description" content="Explore and save your favorite Safa World premium products.">
    <link rel="canonical" href="https://safaworldbd.com/wishlist">
    <link rel="icon" type="image/png" href="images/safa-world-logo.jpg">

    <!-- PWA Manifest & Mobile Meta -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Safa World">
    <link rel="apple-touch-icon" href="images/icons/icon-192x192.png">

    <!-- Open Graph / Meta -->
    <meta property="og:title" content="Wishlist — Safa World">
    <meta property="og:description" content="Explore and save your favorite Safa World premium products.">
    <meta property="og:image" content="https://safaworldbd.com/images/safa-world-logo.jpg">
    <meta property="og:url" content="https://safaworldbd.com/wishlist">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="stylesheet" href="css/home.css?v=26">
    <link rel="stylesheet" href="css/products.css?v=26">
    <link rel="stylesheet" href="css/wishlist.css?v=26">
    <link rel="stylesheet" href="css/product.css?v=26">
    <link rel="stylesheet" href="css/info-pages.css?v=26">

</head>

<body>
    <!-- GLOBAL LOADER -->
    <div id="global-loader" class="global-loader"></div>


    <!-- COMPONENTS -->
    <div id="toast-container"></div>

    <div id="float-wa"></div>
    <div id="float-cart"></div>

    <div id="drawer-container"></div>

    <div id="topnavbar-container"></div>

    <div id="subnavbar-container"></div>

    <div id="bc-br" class="bc-br-section">
        <title>Wishlist</title>
    </div>

    <!-- PAGE -->
    <div class="page">

        <!-- WISHLIST GRID -->
        <div class="wishlist-grid" id="wishlistContainer">
            <p>Loading wishlist...</p>
        </div>

        <!-- EMPTY -->
        <div class="wishlist-empty" id="emptyWishlist" style="display:none">
            <div class="empty-icon">
                ❤️
            </div>
            <div class="empty-title">
                Your wishlist is empty
            </div>
            <div class="empty-sub">
                Save your favorite Safa World products
            </div>
            <button class="btn-shop"
                onclick="if(typeof spaNavigate==='function')spaNavigate('/product-list');else window.location.href='/product-list'">
                Continue Shopping
            </button>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer-section">
        <div id="eco-container"></div>
        <div id="footer-container"></div>
    </div>

    <!-- JS -->
    <script src="js/env.js?v=26"></script>
    <script src="js/tracking.js?v=26"></script>
    <script src="js/marketing.js?v=26"></script>
    <script src="js/config.js?v=26"></script>

    <script src="js/main.js?v=26"></script>
    <script src="js/spa-router.js?v=26"></script>
    <script src="js/loadComponents.js?v=26"></script>
    <script src="js/site-content.js?v=26"></script>

    <script src="js/cart.js?v=26"></script>
    <script src="js/checkout.js?v=26"></script>
    <script src="js/wishlist.js?v=26"></script>

    <script src="js/auth.js?v=26"></script>
    <script src="js/product_list.js?v=26"></script>


</body>

</html>
