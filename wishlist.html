<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Wishlist — Safa World
    </title>

    <meta name="description" content="Explore Safa World premium products wishlist.">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="stylesheet" href="css/home.css?v=12">
    <link rel="stylesheet" href="css/products.css?v=12">
    <link rel="stylesheet" href="css/wishlist.css?v=12">
    <link rel="stylesheet" href="css/product.css?v=12">
    <link rel="stylesheet" href="css/info-pages.css?v=12">

</head>

<body>
    <!-- GLOBAL LOADER -->
    <div id="global-loader" class="global-loader"></div>


    <!-- COMPONENTS -->
    <div id="toast-container"></div>

    <div id="float-wa"></div>
    <div id="float-cart"></div>

    <div id="drawer-container"></div>

    <div id="topnavbar-container"></div>

    <div id="subnavbar-container"></div>

    <div id="bc-br" class="bc-br-section">
        <title>Wishlist</title>
    </div>

    <!-- PAGE -->
    <div class="page">
        <div class="wishlist-head">
            <h1 class="wishlist-title">
                My Wishlist ❤️
            </h1>
            <div class="wishlist-count" id="wishlistCountText">
                0 Items
            </div>
        </div>

        <!-- WISHLIST GRID -->
        <div class="wishlist-grid" id="wishlistContainer">
            <p>Loading wishlist...</p>
        </div>

        <!-- EMPTY -->
        <div class="wishlist-empty" id="emptyWishlist" style="display:none">
            <div class="empty-icon">
                ❤️
            </div>
            <div class="empty-title">
                Your wishlist is empty
            </div>
            <div class="empty-sub">
                Save your favorite Safa World products
            </div>
            <button class="btn-shop" onclick="window.location.href='product-list.html'">
                Continue Shopping
            </button>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer-section">
        <div id="eco-container"></div>
        <div id="footer-container"></div>
    </div>

    <!-- JS -->
    <script src="js/env.js?v=12"></script>
    <script src="js/tracking.js?v=12"></script>
    <script src="js/marketing.js?v=12"></script>
    <script src="js/config.js?v=12"></script>

    <script src="js/main.js?v=12"></script>
    <script src="js/loadComponents.js?v=12"></script>
    <script src="js/site-content.js?v=12"></script>

    <script src="js/cart.js?v=12"></script>
    <script src="js/checkout.js?v=12"></script>
    <script src="js/wishlist.js?v=12"></script>

    <script src="js/auth.js?v=12"></script>
    <script src="js/product_list.js?v=12"></script>


</body>

</html>
