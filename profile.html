<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — Safa World</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <link rel="stylesheet" href="css/home.css?v=20">
  <link rel="stylesheet" href="css/profile.css?v=20">
  <link rel="stylesheet" href="css/info-pages.css?v=20">
</head>

<body>
  <!-- GLOBAL LOADER -->
  <div id="global-loader" class="global-loader"></div>


  <div id="toast-container"></div>
  <div id="float-wa"></div>
  <div id="float-cart"></div>
  <div id="drawer-container"></div>
  <div id="topnavbar-container"></div>
  <div id="subnavbar-container"></div>
  <div id="bc-br" class="bc-br-section">
    <title>Profile</title>
  </div>

  <div class="page">
    <div class="account-links">
      <a href="/profile">
        <i class="fa fa-user"></i> <span>Profile</span>
      </a>
      <a href="/my-orders">
        <!-- <i class="fa fa-box-open"></i> -->
        📦 <span>My Orders</span>
      </a>
      <a href="/address">
        <i class="fa fa-location-arrow"></i> <span>Address Book</span>
      </a>
      <a onclick="logoutUser()">
        ⏻ <span>Logout</span>
      </a>
    </div>
    <div class="profile-card">
      <div class="profile-form-grid">
        <div class="profile-row">
          <label>Full Name</label>
          <input id="profileFullName" type="text" placeholder="Enter your full name">
        </div>

        <div class="profile-row">
          <label>Phone</label>
          <input id="profilePhone" type="text" placeholder="Enter your phone number">
        </div>

        <div class="profile-row">
          <label>WhatsApp Number</label>
          <input id="profileWhatsapp" type="text" placeholder="Enter WhatsApp number">
        </div>

        <div class="profile-row">
          <label>Email</label>
          <input id="profileEmail" type="text" placeholder="Enter email">
        </div>
      </div>
      <div class="profile-btn-wrap">
        <button onclick="saveProfile()">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer-section">
    <div id="eco-container"></div>
    <div id="footer-container"></div>
  </div>

  <!-- JS -->
  <script src="js/env.js?v=20"></script>
  <script src="js/tracking.js?v=20"></script>
  <script src="js/marketing.js?v=20"></script>
  <script src="js/config.js?v=20"></script>

  <script src="js/main.js?v=20"></script>
  <script src="js/spa-router.js?v=20"></script>
  <script src="js/loadComponents.js?v=20"></script>
  <script src="js/site-content.js?v=20"></script>

  <script src="js/profile.js?v=20"></script>

  <script src="js/auth.js?v=20"></script>
  <script src="js/product_list.js?v=20"></script>

</body>

</html>
